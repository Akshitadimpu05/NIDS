autoencoder:
  batch_size: 256
  dropout_rate: 0.2
  epochs: 100
  hidden_dims:
  - 64
  - 32
  - 16
  - 8
  input_dim: 54
  latent_dim: 4
  learning_rate: 0.001
  reconstruction_threshold: 0.1
capsnet:
  batch_size: 128
  digit_caps_dim: 16
  digit_caps_num: 4
  epochs: 50
  input_dim: 54
  learning_rate: 0.001
  primary_caps_dim: 8
  primary_caps_num: 32
  routing_iterations: 3
data:
  features:
  - flow_duration
  - total_fwd_packets
  - total_bwd_packets
  - total_length_fwd_packets
  - total_length_bwd_packets
  - fwd_packet_length_max
  - fwd_packet_length_min
  - fwd_packet_length_mean
  - fwd_packet_length_std
  - bwd_packet_length_max
  - bwd_packet_length_min
  - bwd_packet_length_mean
  - bwd_packet_length_std
  - flow_bytes_s
  - flow_packets_s
  - flow_iat_mean
  - flow_iat_std
  - flow_iat_max
  - flow_iat_min
  - fwd_iat_total
  - fwd_iat_mean
  - fwd_iat_std
  - fwd_iat_max
  - fwd_iat_min
  - bwd_iat_total
  - bwd_iat_mean
  - bwd_iat_std
  - bwd_iat_max
  - bwd_iat_min
  - fwd_psh_flags
  - bwd_psh_flags
  - fwd_urg_flags
  - bwd_urg_flags
  - fwd_header_length
  - bwd_header_length
  - fwd_packets_s
  - bwd_packets_s
  - min_packet_length
  - max_packet_length
  - packet_length_mean
  - packet_length_std
  - packet_length_variance
  - fin_flag_count
  - syn_flag_count
  - rst_flag_count
  - psh_flag_count
  - ack_flag_count
  - urg_flag_count
  - cwe_flag_count
  - ece_flag_count
  - down_up_ratio
  - average_packet_size
  - avg_fwd_segment_size
  - avg_bwd_segment_size
  - fwd_header_length_1
  - fwd_avg_bytes_bulk
  - fwd_avg_packets_bulk
  - fwd_avg_bulk_rate
  - bwd_avg_bytes_bulk
  - bwd_avg_packets_bulk
  - bwd_avg_bulk_rate
  - subflow_fwd_packets
  - subflow_fwd_bytes
  - subflow_bwd_packets
  - subflow_bwd_bytes
  - init_win_bytes_forward
  - init_win_bytes_backward
  - act_data_pkt_fwd
  - min_seg_size_forward
  - active_mean
  - active_std
  - active_max
  - active_min
  - idle_mean
  - idle_std
  - idle_max
  - idle_min
  handle_missing: mean
  normalization: standard
rl_agent:
  action_dim: 3
  algorithm: PPO
  batch_size: 64
  buffer_size: 100000
  epsilon: 0.1
  gamma: 0.99
  hidden_dims:
  - 128
  - 64
  learning_rate: 0.0003
  state_dim: 12
  update_frequency: 1000
training:
  device: cpu
  early_stopping_patience: 10
  num_workers: 4
  save_frequency: 10
  validation_split: 0.2
