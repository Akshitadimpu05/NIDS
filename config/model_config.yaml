# Model Configuration for NIDS-RL System

# Autoencoder Configuration
autoencoder:
  input_dim: 78  # Number of flow features
  hidden_dims: [64, 32, 16, 8]  # Encoder layers
  latent_dim: 4  # Bottleneck dimension
  dropout_rate: 0.2
  learning_rate: 0.001
  batch_size: 256
  epochs: 100
  reconstruction_threshold: 0.1  # Anomaly detection threshold

# Capsule Network Configuration
capsnet:
  input_dim: 78
  primary_caps_dim: 8
  primary_caps_num: 32
  digit_caps_dim: 16
  digit_caps_num: 10  # Number of traffic classes
  routing_iterations: 3
  learning_rate: 0.001
  batch_size: 128
  epochs: 50

# Reinforcement Learning Configuration
rl_agent:
  algorithm: "PPO"  # Options: PPO, DQN, A2C
  state_dim: 12  # AE reconstruction error + CapsNet features
  action_dim: 3  # Allow, Block, Throttle
  hidden_dims: [128, 64]
  learning_rate: 0.0003
  gamma: 0.99  # Discount factor
  epsilon: 0.1  # Exploration rate (for DQN)
  buffer_size: 100000
  batch_size: 64
  update_frequency: 1000

# Training Configuration
training:
  device: "cuda"  # cuda or cpu
  num_workers: 4
  save_frequency: 10  # Save model every N epochs
  validation_split: 0.2
  early_stopping_patience: 10

# Data Configuration
data:
  features:
    - "flow_duration"
    - "total_fwd_packets"
    - "total_bwd_packets"
    - "total_length_fwd_packets"
    - "total_length_bwd_packets"
    - "fwd_packet_length_max"
    - "fwd_packet_length_min"
    - "fwd_packet_length_mean"
    - "fwd_packet_length_std"
    - "bwd_packet_length_max"
    - "bwd_packet_length_min"
    - "bwd_packet_length_mean"
    - "bwd_packet_length_std"
    - "flow_bytes_s"
    - "flow_packets_s"
    - "flow_iat_mean"
    - "flow_iat_std"
    - "flow_iat_max"
    - "flow_iat_min"
    - "fwd_iat_total"
    - "fwd_iat_mean"
    - "fwd_iat_std"
    - "fwd_iat_max"
    - "fwd_iat_min"
    - "bwd_iat_total"
    - "bwd_iat_mean"
    - "bwd_iat_std"
    - "bwd_iat_max"
    - "bwd_iat_min"
    - "fwd_psh_flags"
