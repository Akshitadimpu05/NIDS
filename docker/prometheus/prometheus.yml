global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # NIDS Orchestrator metrics
  - job_name: 'nids-orchestrator'
    static_configs:
      - targets: ['orchestrator:8000']
    metrics_path: '/metrics'
    scrape_interval: 5s

  # NIDS Fog Nodes metrics
  - job_name: 'nids-fog-nodes'
    static_configs:
      - targets: 
          - 'fog-node-1:8080'
          - 'fog-node-2:8080'
          - 'fog-node-3:8080'
    metrics_path: '/metrics'
    scrape_interval: 5s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
